<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f231a" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#121d24" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2fd3e9" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#3a00ff" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="600" height="400" fill="#0d111a"/>
  <rect width="600" height="400" fill="url(#bg)"/>
  
  <!-- Subtle grid pattern -->
  <g opacity="0.08" stroke="#fff" stroke-width="1">
    <line x1="0" y1="50" x2="600" y2="50"/>
    <line x1="0" y1="100" x2="600" y2="100"/>
    <line x1="0" y1="150" x2="600" y2="150"/>
    <line x1="0" y1="200" x2="600" y2="200"/>
    <line x1="0" y1="250" x2="600" y2="250"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="0" y1="350" x2="600" y2="350"/>
    <line x1="100" y1="0" x2="100" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="300" y1="0" x2="300" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
  </g>
  
  <!-- Glowing circle element -->
  <circle cx="300" cy="170" r="85" fill="none" stroke="rgba(47, 211, 233, 0.4)" stroke-width="2"/>
  <circle cx="300" cy="170" r="70" fill="rgba(13, 17, 26, 0.7)" filter="url(#shadow)"/>
  
  <!-- Icon symbol based on type -->
  <g transform="translate(265, 135)" fill="#2fd3e9">
    <path d="M35 5 C18.4 5 5 18.4 5 35 C5 40.5 6.5 45.7 9.1 50.1 L5 65 L20.3 61 C24.6 63.5 29.6 65 35 65 C51.6 65 65 51.6 65 35 C65 18.4 51.6 5 35 5 Z" opacity="0.9"/>
    <path d="M28 25 C26.9 25 26 25.9 26 27 L26 43 C26 44.1 26.9 45 28 45 L42 45 C43.1 45 44 44.1 44 43 L44 27 C44 25.9 43.1 25 42 25 Z" fill="#fff" opacity="0.95"/>
  </g>
  
  <!-- Project Title and Subtitle -->
  <text x="300" y="305" font-family="'Poppins', sans-serif" font-size="28" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">Spotify Clone</text>
  <text x="300" y="340" font-family="'Mulish', sans-serif" font-size="15" font-weight="400" fill="#2fd3e9" text-anchor="middle" letter-spacing="1.5">RESPONSIVE UI • FRONT-END</text>
  
  <!-- Top badge -->
  <rect x="230" y="25" width="140" height="28" rx="14" fill="rgba(255, 255, 255, 0.1)" stroke="rgba(47, 211, 233, 0.5)" stroke-width="1"/>
  <text x="300" y="44" font-family="'Mulish', sans-serif" font-size="11" font-weight="600" fill="#2fd3e9" text-anchor="middle" letter-spacing="1">PROJECT SHOWCASE</text>
</svg>